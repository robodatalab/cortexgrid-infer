[project]
name = "model-gateway"
version = "0.1.6"
description = "Deploy and interact with models across providers (Anthropic, HuggingFace LLM + diffusion)"
requires-python = ">=3.11"
dependencies = [
    "cortexgrid",
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "huggingface_hub>=0.20.0",
    "anthropic>=0.40.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "fastapi>=0.110.0",
    # Diffusion serving (huggingface_image provider). FLUX.2 pipelines land in
    # diffusers 0.38; the Qwen3 text encoder needs sentencepiece + protobuf.
    "diffusers>=0.38",
    "pillow>=10.0",
    "accelerate>=0.33",
    "sentencepiece>=0.2",
    "protobuf>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
