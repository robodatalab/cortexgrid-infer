[project]
name = "model-gateway"
version = "0.1.2"
description = "Deploy and interact with LLMs across providers (Anthropic, HuggingFace)"
requires-python = ">=3.11"
dependencies = [
    "cortexflow",
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "huggingface_hub>=0.20.0",
    "anthropic>=0.40.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "fastapi>=0.110.0",
]

[tool.uv.sources]
cortexflow = { git = "https://github.com/robodatalab/robolab-infra.git"}

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
