[project]
name = "cortexgrid-infer"
version = "0.3.5"
description = "Serve apps per task (text-to-text, text-to-image, image-to-mesh) and importers per source (HuggingFace) for running models on cortexgrid"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.12"
dependencies = [
    # wait_for_model_serving / ModelDeployFailed, and deploy_model clearing a
    # failed Serve app. 0.2.93: serve-app routes work on the Ray 2.58 cluster.
    # 0.2.96: import_model, which re-bundles changed serve-app code (#440).
    # 0.2.97: ModelRequirements on import_model - the serve app's num_gpus /
    # num_replicas class attributes are no longer read (#446).
    # 0.3.4: jobs return results (remote -> JobFuture), register_model for a
    # model that stages no weights, model_config, and deploy_model skipping a
    # redundant PUT - which is why this library has no reuse guard of its own.
    "cortexgrid>=0.3.4",
    "torch>=2.0.0",
    # 4.47: CompileConfig, which the completion serve app hands to `generate`
    # alongside a static cache so transformers compiles the decode step itself.
    "transformers>=4.47.0",
    "huggingface_hub>=0.20.0",
    "anthropic>=0.40.0",
    # serve_apps.gemini. The unified Google Gen AI SDK, not the deprecated
    # google-generativeai.
    "google-genai>=1.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    # The serve-apps run on the cluster's FastAPI, which Ray 2.58's Serve
    # requires to be >=0.133.
    "fastapi>=0.133",
    # Text-to-image serving (serve_apps.text2image). FLUX.2 pipelines land in
    # diffusers 0.38; the Qwen3 text encoder needs sentencepiece + protobuf.
    "diffusers>=0.38",
    "pillow>=10.0",
    "accelerate>=0.33",
    "sentencepiece>=0.2",
    "protobuf>=4.0",
    # Image-to-mesh: meshes travel as numpy arrays (core.GeneratedMesh).
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/robodatalab/cortexgrid-infer"
Repository = "https://github.com/robodatalab/cortexgrid-infer"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["/cortexgrid_infer"]
